name: Executar finalização auditada

on:
  push:
    branches: [main]
    paths:
      - .audit-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar patch da auditoria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/finalize-persistence-audit.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'finalize-audit-patch.py', 'exec'), {})
          PY
      - name: Testar aplicação
        run: pnpm lint && pnpm test
      - name: Gerar build
        run: pnpm build
      - name: Testar navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser
      - name: Publicar correções
        run: |
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git rm .github/workflows/finalize-persistence-audit.yml .github/workflows/run-finalize-audit.yml .audit-trigger
          git add src public tests
          git commit -m "Finaliza auditoria de persistência e conclusão operacional"
          git push origin main
