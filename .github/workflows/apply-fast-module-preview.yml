name: Acelerar abertura da visão operacional

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-fast-module-preview.mjs
      - .github/workflows/apply-fast-module-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar abertura rápida
        run: node scripts/patch-fast-module-preview.mjs

      - name: Validar aplicação
        run: pnpm lint && pnpm test && pnpm build

      - name: Validar no navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser

      - name: Publicar correção no repositório
        run: |
          if git diff --quiet -- src/boot.js src/app.js tests/lazy-module-store.test.mjs tests/browser/app.spec.js; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git add src/boot.js src/app.js tests/lazy-module-store.test.mjs tests/browser/app.spec.js
          git commit -m "Acelera abertura da visão operacional de Obras"
          git push origin HEAD:main
