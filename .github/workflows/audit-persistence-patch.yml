name: Aplicar correções de persistência auditadas

on:
  push:
    paths:
      - .github/workflows/audit-persistence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa correções auditadas de persistência'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar patch determinístico
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 trecho, encontrados {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Mantém o catálogo fonte alinhado à migração aplicada no Supabase.
          replace_once(
              'src/module-model.js',
              "valorAnterior:money('previous_amount'),valorNovo:money('new_amount'),delta:money('delta_amount')",
              "valorAnterior:money('previous_amount'),valorNovo:money('new_amount'),valorDelta:money('delta_amount')",
          )

          # EV: só anunciar sucesso após confirmação do banco e restaurar o estado em falha.
          replace_once(
              'src/app.js',
              '''  delete form.dataset.evDeviationConfirmed;\n  const previousTotal = workTotals(work).orcado;''',
              '''  delete form.dataset.evDeviationConfirmed;\n  const workIndex = state.works.findIndex((item) => item.id === work.id);\n  const workSnapshot = clone(work);\n  const historySnapshot = clone(state.history || []);\n  const previousTotal = workTotals(work).orcado;''',
          )
          replace_once(
              'src/app.js',
              '''  saveState();\n  showToast(mode === "draft" ? "Rascunho do EV salvo." : "EV salvo com nova versão.");\n\n  if (form.closest(".ev-modal-card")) openEVModal(work.id);\n  else render();''',
              '''  try {\n    await saveStateAndWait();\n  } catch (error) {\n    if (workIndex >= 0) state.works[workIndex] = workSnapshot;\n    state.history = historySnapshot;\n    showFormError(error?.message || "O EV não foi confirmado pelo banco. Recarregue os dados antes de tentar novamente.", form);\n    return;\n  }\n  showToast(mode === "draft" ? "Rascunho do EV salvo." : "EV salvo com nova versão.");\n\n  if (form.closest(".ev-modal-card")) openEVModal(work.id);\n  else render();''',
          )

          # Postagem da SIC: snapshot, versão de EV e confirmação transacional antes do sucesso.
          replace_once(
              'src/app.js',
              '''  const work = workById(demand.obraId);\n  const metadata = demand.sicMetadata || {};''',
              '''  const work = workById(demand.obraId);\n  const demandIndex = state.demands.findIndex((item) => item.id === demand.id);\n  const workIndex = state.works.findIndex((item) => item.id === work?.id);\n  const demandSnapshot = clone(demand);\n  const workSnapshot = work ? clone(work) : null;\n  const sicsSnapshot = clone(state.sics || []);\n  const historySnapshot = clone(state.history || []);\n  const metadata = demand.sicMetadata || {};''',
          )
          replace_once(
              'src/app.js',
              '''  state.sics.unshift(sic);\n  syncSicWithEV(work, sic);\n  syncWorkSicSummaryLine(work);\n  demand.sicIds = [sic.id];''',
              '''  const sicDiffs = affected.map((item) => {\n    const line = ensureEVLineForDiscipline(work, item.disciplinaId);\n    const before = Number(line.valorOrcado || 0) + aditivadoByDiscipline(work.id, item.disciplinaId);\n    return {\n      disciplinaId: item.disciplinaId,\n      valorAntes: before,\n      valorDepois: before + item.valorDelta,\n    };\n  });\n\n  state.sics.unshift(sic);\n  syncSicWithEV(work, sic);\n  syncWorkSicSummaryLine(work);\n  work.ev.versaoAtual = Number(work.ev.versaoAtual || 0) + 1;\n  work.ev.versions = work.ev.versions || [];\n  const updatedValues = workTotals(work);\n  work.ev.versions.push({\n    numero: work.ev.versaoAtual,\n    data: todayISO(),\n    origem: demand.id,\n    valorTotal: updatedValues.orcado + updatedValues.aditivado,\n    custoM2: (updatedValues.orcado + updatedValues.aditivado) / Math.max(work.areaEquivalente || 0, 1),\n    diffPorDisciplina: sicDiffs,\n  });\n  demand.sicIds = [sic.id];''',
          )
          replace_once(
              'src/app.js',
              '''  saveState();\n  selectedWorkId = work.id;\n  showToast("SIC postada no EV: valor lançado na linha 32 (SIC's).");\n  render();\n  openEVModal(work.id);''',
              '''  try {\n    await saveStateAndWait();\n  } catch (error) {\n    if (demandIndex >= 0) state.demands[demandIndex] = demandSnapshot;\n    if (workIndex >= 0 && workSnapshot) state.works[workIndex] = workSnapshot;\n    state.sics = sicsSnapshot;\n    state.history = historySnapshot;\n    showFormError(error?.message || "A postagem da SIC não foi confirmada pelo banco. Recarregue os dados antes de tentar novamente.", detailForm);\n    return;\n  }\n  selectedWorkId = work.id;\n  showToast("SIC postada no EV e nova versão confirmada no banco.");\n  render();\n  openEVModal(work.id);''',
          )

          # Exclusão de demanda: aguardar banco e desfazer em caso de falha.
          replace_once('src/app.js', 'function handleDeleteDemandSubmit(form) {', 'async function handleDeleteDemandSubmit(form) {')
          replace_once(
              'src/app.js',
              '''  const work = workById(demand.obraId);\n  const deletedRecord = {''',
              '''  const work = workById(demand.obraId);\n  const demandsSnapshot = clone(state.demands || []);\n  const deletedSnapshot = clone(state.deletedDemands || []);\n  const historySnapshot = clone(state.history || []);\n  const deletedRecord = {''',
          )
          replace_once(
              'src/app.js',
              '''  saveState();\n  closeModal();\n  showToast(`${demand.id} excluída do Kanban com justificativa registrada.`);\n  render();''',
              '''  try {\n    await saveStateAndWait();\n  } catch (error) {\n    state.demands = demandsSnapshot;\n    state.deletedDemands = deletedSnapshot;\n    state.history = historySnapshot;\n    showFormError(error?.message || "A exclusão não foi confirmada pelo banco. Recarregue os dados antes de tentar novamente.", form);\n    return;\n  }\n  closeModal();\n  showToast(`${demand.id} excluída do Kanban com justificativa confirmada no banco.`);\n  render();''',
          )

          # Contratação: confirmação e rollback.
          replace_once('src/app.js', 'function handleContractSubmit(form) {', 'async function handleContractSubmit(form) {')
          replace_once(
              'src/app.js',
              '''  const contract = {\n    id: nextCode("CTR", state.contracts),''',
              '''  const contractsSnapshot = clone(state.contracts || []);\n  const historySnapshot = clone(state.history || []);\n  const contract = {\n    id: nextCode("CTR", state.contracts),''',
          )
          replace_once(
              'src/app.js',
              '''  saveState();\n  closeModal();\n  showToast("Contratação vinculada à disciplina.");\n  render();''',
              '''  try {\n    await saveStateAndWait();\n  } catch (error) {\n    state.contracts = contractsSnapshot;\n    state.history = historySnapshot;\n    showFormError(error?.message || "A contratação não foi confirmada pelo banco. Recarregue os dados antes de tentar novamente.", form);\n    return;\n  }\n  closeModal();\n  showToast("Contratação vinculada à disciplina e confirmada no banco.");\n  render();''',
          )

          # Aprovação/reprovação de SIC: não sinalizar sucesso antes da revisão retornar do banco.
          replace_once('src/app.js', 'function approveSicDemand(id) {', 'async function approveSicDemand(id) {')
          replace_once(
              'src/app.js',
              '''  const previous = sicApprovalReading(demand).label;\n  demand.sicApprovalStatus = "Aprovado";''',
              '''  const demandIndex = state.demands.findIndex((item) => item.id === demand.id);\n  const demandSnapshot = clone(demand);\n  const historySnapshot = clone(state.history || []);\n  const previous = sicApprovalReading(demand).label;\n  demand.sicApprovalStatus = "Aprovado";''',
          )
          replace_once(
              'src/app.js',
              '''  const reopenDetail = Boolean(document.querySelector(`#demandDetailForm[data-id="${demand.id}"]`));\n  saveState();\n  showToast(`${demand.id} aprovada para postagem no EV.`);''',
              '''  const reopenDetail = Boolean(document.querySelector(`#demandDetailForm[data-id="${demand.id}"]`));\n  try {\n    await saveStateAndWait();\n  } catch (error) {\n    if (demandIndex >= 0) state.demands[demandIndex] = demandSnapshot;\n    state.history = historySnapshot;\n    showToast(error?.message || "A aprovação da SIC não foi confirmada pelo banco. Recarregue os dados.");\n    render();\n    return;\n  }\n  showToast(`${demand.id} aprovada para postagem no EV.`);''',
          )
          replace_once('src/app.js', 'function rejectSicDemand(id) {', 'async function rejectSicDemand(id) {')
          replace_once(
              'src/app.js',
              '''  const previous = sicApprovalReading(demand).label;\n  demand.sicApprovalStatus = "Reprovado";''',
              '''  const demandIndex = state.demands.findIndex((item) => item.id === demand.id);\n  const demandSnapshot = clone(demand);\n  const historySnapshot = clone(state.history || []);\n  const previous = sicApprovalReading(demand).label;\n  demand.sicApprovalStatus = "Reprovado";''',
          )
          replace_once(
              'src/app.js',
              '''  const reopenDetail = Boolean(document.querySelector(`#demandDetailForm[data-id="${demand.id}"]`));\n  saveState();\n  showToast(`${demand.id} reprovada para revisão antes do EV.`);''',
              '''  const reopenDetail = Boolean(document.querySelector(`#demandDetailForm[data-id="${demand.id}"]`));\n  try {\n    await saveStateAndWait();\n  } catch (error) {\n    if (demandIndex >= 0) state.demands[demandIndex] = demandSnapshot;\n    state.history = historySnapshot;\n    showToast(error?.message || "A reprovação da SIC não foi confirmada pelo banco. Recarregue os dados.");\n    render();\n    return;\n  }\n  showToast(`${demand.id} reprovada para revisão antes do EV.`);''',
          )

          # Os chamadores já estão em listeners async; aguardar os novos handlers.
          replace_once('src/app.js', '    handleEVSubmit(form, actionButton.dataset.mode || "final");', '    await handleEVSubmit(form, actionButton.dataset.mode || "final");')
          replace_once('src/app.js', '    approveSicDemand(actionButton.dataset.id);', '    await approveSicDemand(actionButton.dataset.id);')
          replace_once('src/app.js', '    rejectSicDemand(actionButton.dataset.id);', '    await rejectSicDemand(actionButton.dataset.id);')
          replace_once('src/app.js', '    handleDeleteDemandSubmit(event.target);', '    await handleDeleteDemandSubmit(event.target);')
          replace_once('src/app.js', '    handleContractSubmit(event.target);', '    await handleContractSubmit(event.target);')

          # Anexos: se o upload binário falhar, remover o metadado criado antes dele.
          replace_once(
              'src/boot.js',
              '''      const upload = await client.storage.from('slt360-attachments').upload(record.id, record.blob, { upsert: false, contentType: record.blob.type || 'application/octet-stream' });\n      if (upload.error) throw upload.error;''',
              '''      const upload = await client.storage.from('slt360-attachments').upload(record.id, record.blob, { upsert: false, contentType: record.blob.type || 'application/octet-stream' });\n      if (upload.error) {\n        const cleanup = await client.from('slt360_attachments').delete().eq('id', record.id);\n        if (cleanup.error) console.warn('Não foi possível remover o metadado do anexo após falha no upload.', cleanup.error);\n        throw upload.error;\n      }''',
          )

          # Workflow é descartável; o commit final não o mantém no repositório.
          Path('.github/workflows/audit-persistence-patch.yml').unlink()

      - name: Testar aplicação
        run: pnpm test
      - name: Gerar build
        run: pnpm build
      - name: Publicar correções no repositório
        run: |
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git add src/app.js src/boot.js src/module-model.js .github/workflows/audit-persistence-patch.yml
          git commit -m "Confirma persistência crítica de EV, SIC e contratos"
          git push origin HEAD:main
