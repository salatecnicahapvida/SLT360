name: Publicar SLT360

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testar aplicação
        run: pnpm lint && pnpm test

      - name: Gerar build de produção
        run: pnpm build

      - name: Verificar fluxos no navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar build do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Conferir versão publicada
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deploy solicitado para: $DEPLOY_URL"
          for attempt in 1 2 3 4 5 6; do
            data=$(curl --fail --silent --show-error --max-time 15 "${DEPLOY_URL%/}/release.json" || true)
            if printf '%s' "$data" | grep -Fq "$GITHUB_SHA"; then
              echo "Versão $GITHUB_SHA confirmada no site público."
              exit 0
            fi
            echo "Aguardando propagação da versão, tentativa $attempt."
            sleep 10
          done
          echo "::error::O endereço público não está servindo a versão publicada ($GITHUB_SHA)."
          exit 1
