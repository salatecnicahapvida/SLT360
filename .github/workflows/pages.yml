name: Publicar SLT360

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testar aplicação
        run: pnpm lint && pnpm test

      - name: Gerar build de produção
        run: pnpm build

      - name: Instalar navegador de teste
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "Falha ao instalar o Chromium (tentativa ${attempt}/3). Tentando novamente..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Verificar fluxos no navegador
        run: pnpm test:browser

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar build do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
