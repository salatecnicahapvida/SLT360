name: Fechar auditoria de persistência

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-persistence-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar endurecimento de persistência
        run: node scripts/finalize-persistence-audit.mjs
      - name: Lint e testes unitários
        run: pnpm lint && pnpm test
      - name: Build de produção
        run: pnpm build
      - name: Testes de navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser
      - name: Publicar correções auditadas
        shell: bash
        run: |
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git rm -f .github/workflows/close-persistence-audit.yml scripts/finalize-persistence-audit.mjs
          git add src tests public
          git commit -m "Conclui auditoria de persistência do SLT360"
          git push origin main
