name: Ordenar cards do Kanban por etapa

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-kanban-column-sort.mjs
      - .github/workflows/apply-kanban-column-sort.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar ordenação do Kanban
        run: node scripts/patch-kanban-column-sort.mjs

      - name: Validar aplicação
        run: pnpm lint && pnpm test && pnpm build

      - name: Validar no navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser

      - name: Publicar correção no repositório
        run: |
          if git diff --quiet -- src/app.js src/styles.css tests/browser/app.spec.js; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git add src/app.js src/styles.css tests/browser/app.spec.js
          git commit -m "Adiciona reordenação por etapa no Kanban"
          git push origin HEAD:main
