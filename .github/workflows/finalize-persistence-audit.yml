name: Finalizar auditoria de persistência

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-persistence-audit.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar correções auditadas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              return text.replace(old, new, 1)

          def exact_count(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: esperado {expected}, encontrado {count}')
              return text.replace(old, new)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 regex, encontrado {count}')
              return updated

          # Modelo relacional: conclusão da demanda vira campo estruturado no banco.
          path = 'src/module-model.js'
          text = read(path)
          text = once(
              text,
              "  entity('budget_demands','budget','state.demands',taskFields),",
              "  entity('budget_demands','budget','state.demands',{...taskFields,valorGerado:money('generated_amount'),evSemMudanca:f('ev_no_change','boolean')}),",
              'budget demand completion fields',
          )
          write(path, text)

          path = 'src/app.js'
          text = read(path)

