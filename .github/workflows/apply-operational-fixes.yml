name: Executar ajustes finais do operacional

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-operational-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar patch
        run: python3 scripts/repair-operational-fixes.py
      - name: Aplicar alterações
        run: python3 scripts/apply-operational-fixes.py
      - name: Testar código
        run: pnpm lint && pnpm test
      - name: Gerar build
        run: pnpm build
      - name: Testar navegador
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: pnpm test:browser
      - name: Publicar alterações
        shell: bash
        run: |
          git config user.name "salatecnicahapvida"
          git config user.email "ciceroc@hapvida.com.br"
          git rm -f .github/workflows/apply-operational-fixes.yml .github/workflows/finalize-persistence-audit.yml .github/workflows/run-finalize-audit.yml .audit-trigger scripts/apply-operational-fixes.py scripts/repair-operational-fixes.py 2>/dev/null || true
          git add src public tests
          git commit -m "Ajusta conclusão e visão operacional de demandas"
          git push origin main
