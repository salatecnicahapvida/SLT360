<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLT 360</title>
    <meta
      name="description"
      content="Sistema de Gestão da Sala Técnica de Engenharia"
    />
    <link rel="stylesheet" href="styles.css?v=20260901-strategic-unified-ev" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <button class="brand-home" type="button" data-view="dashboard" aria-label="Voltar para Home do SLT 360">
          <img class="brand-logo brand-logo--slt" src="assets/logo-slt360.png" alt="SLT 360" />
        </button>
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo brand-logo--hapvida" src="assets/logo-hapvida.png" alt="Hapvida" />
      </div>

      <nav class="top-nav" aria-label="Navegação principal">
        <button class="top-nav__item top-nav__home is-active" type="button" data-view="dashboard">
          Home
        </button>
        <button class="top-nav__item" type="button" data-view="projectsHome" data-module="projects">
          Projetos
        </button>
        <button class="top-nav__item" type="button" data-view="worksHome" data-module="works">
          Orçamento
        </button>
        <button class="top-nav__item" type="button" data-view="maintenance" data-module="maintenance">
          Manutenção
        </button>
        <button class="top-nav__item" type="button" data-view="clinical" data-module="clinical">
          Eng. Clínica
        </button>
        <button class="top-nav__item" type="button" data-view="budget">
          Controle de Verbas
        </button>
        <button class="top-nav__item" type="button" data-view="settings">
          Configuração
        </button>
      </nav>

      <div class="header-actions">
        <label class="search-box">
          <span class="sr-only">Buscar obra, demanda, fornecedor ou cidade</span>
          <input id="globalSearch" type="search" placeholder="Buscar obra, demanda, fornecedor, cidade." />
        </label>
        <span class="user-chip">Coordenação ST</span>
        <button class="secondary-action logout-action" type="button" data-action="logout" hidden>Sair</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar" aria-label="Menu lateral">
        <button class="side-link is-active" type="button" data-view="dashboard">
          <span>Início</span>
        </button>
        <button class="side-link" type="button" data-view="worksHome">
          <span>Orçamento 360</span>
        </button>
        <button class="side-link" type="button" data-view="projectsHome">
          <span>Projetos 360</span>
        </button>
        <button class="side-link" type="button" data-view="projectsPortfolio">
          <span>Portfólio Projetos</span>
        </button>
        <button class="side-link" type="button" data-view="projectsPlan">
          <span>Plano de Investimento</span>
        </button>
        <button class="side-link" type="button" data-view="projectsOperational">
          <span>Operacional Projetos</span>
        </button>
        <button class="side-link" type="button" data-view="worksOperational">
          <span>Operacional Orçamento</span>
        </button>
        <button class="side-link" type="button" data-view="worksManagement">
          <span>Gerencial</span>
        </button>
        <button class="side-link" type="button" data-view="worksStrategic">
          <span>Estratégica</span>
        </button>
        <button class="side-link" type="button" data-view="portfolio">
          <span>Portfólio</span>
        </button>
        <button class="side-link" type="button" data-view="investmentPlan">
          <span>Plano de Investimento</span>
        </button>
        <button class="side-link" type="button" data-view="ev">
          <span>EV detalhado</span>
        </button>
        <button class="side-link" type="button" data-view="worksSettings">
          <span>Config. Orçamento</span>
        </button>
        <button class="side-link" type="button" data-view="maintenance">
          <span>Manutenção</span>
        </button>
        <button class="side-link" type="button" data-view="maintenanceOperational">
          <span>Operacional Manutenção</span>
        </button>
        <button class="side-link" type="button" data-view="maintenanceReports">
          <span>BI Manutenção</span>
        </button>
        <button class="side-link" type="button" data-view="clinical">
          <span>Engenharia Clínica</span>
        </button>
        <button class="side-link" type="button" data-view="sics">
          <span>SICs</span>
        </button>
        <button class="side-link" type="button" data-view="analytics">
          <span>Disciplina & Tipologia</span>
        </button>
        <button class="side-link" type="button" data-view="budget">
          <span>Controle de Verbas</span>
        </button>
        <button class="side-link" type="button" data-view="suppliers">
          <span>Fornecedores</span>
        </button>
        <button class="side-link" type="button" data-view="settings">
          <span>Configurações</span>
        </button>
      </aside>

      <section class="workspace" id="app" aria-live="polite"></section>
    </main>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data/traco-imported-state.js?v=20260819-traco-projetos"></script>
    <script src="data/sic-bi-data.js?v=20260819-traco-projetos"></script>
    <script src="data/investment-plan-data.js?v=20260819-traco-projetos"></script>
    <script src="data/unit-registry-data.js?v=20260819-traco-projetos"></script>
    <script src="data/maintenance-data.js?v=20260814-pipefy-maintenance"></script>
    <script src="data/capex-control-data.js?v=20260819-traco-projetos"></script>
    <script src="data/commission-obras-data.js?v=20260819-traco-projetos"></script>
    <script src="data/general-works-data.js?v=20260827-obras-historicas"></script>
    <script src="data/ev-historical-data.js?v=20260901-ev-children"></script>
    <script src="data/sic-approval-dashboard-html.js?v=20260825-sic-approval-update1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="app.js?v=20260901-strategic-unified-ev"></script>
  </body>
</html>
