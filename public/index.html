<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLT 360</title>
    <meta name="description" content="Sistema de Gestão da Sala Técnica de Engenharia" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://mgpkgxcenxnqvvujlclh.supabase.co wss://mgpkgxcenxnqvvujlclh.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'" />
    <link rel="stylesheet" href="styles.css?v=20260930-portfolio-header-v2" />
    <link rel="stylesheet" href="cloud.css" />
    <style>
      /* Portfólio de Obras: cabeçalhos financeiros com largura real e quebra de linha.
         A correção é estrutural: não substitui o texto e não deixa um cabeçalho invadir o outro. */
      .portfolio-works-table {
        min-width: 1640px !important;
      }

      .portfolio-works-table th:nth-child(8),
      .portfolio-works-table td:nth-child(8) {
        width: 170px !important;
        min-width: 170px !important;
        max-width: 170px !important;
      }

      .portfolio-works-table th:nth-child(9),
      .portfolio-works-table td:nth-child(9) {
        width: 220px !important;
        min-width: 220px !important;
        max-width: 220px !important;
      }

      .portfolio-works-table th:nth-child(10),
      .portfolio-works-table td:nth-child(10) {
        width: 205px !important;
        min-width: 205px !important;
        max-width: 205px !important;
      }

      .portfolio-works-table th:nth-child(11),
      .portfolio-works-table td:nth-child(11) {
        width: 92px !important;
        min-width: 92px !important;
        max-width: 92px !important;
      }

      .portfolio-works-table th:nth-child(8),
      .portfolio-works-table th:nth-child(9),
      .portfolio-works-table th:nth-child(10) {
        height: auto !important;
        min-height: 58px !important;
        overflow: visible !important;
        vertical-align: middle !important;
        white-space: normal !important;
      }

      .portfolio-works-table th:nth-child(8) .portfolio-sort-button,
      .portfolio-works-table th:nth-child(9) .portfolio-sort-button,
      .portfolio-works-table th:nth-child(10) .portfolio-sort-button {
        display: flex !important;
        width: 100% !important;
        min-width: 0 !important;
        min-height: 58px !important;
        align-items: center !important;
        justify-content: flex-end !important;
        gap: 6px !important;
        padding: 8px 10px !important;
        overflow: visible !important;
        white-space: normal !important;
      }

      .portfolio-works-table th:nth-child(8) .portfolio-sort-button span,
      .portfolio-works-table th:nth-child(9) .portfolio-sort-button span,
      .portfolio-works-table th:nth-child(10) .portfolio-sort-button span {
        display: block !important;
        flex: 1 1 auto !important;
        min-width: 0 !important;
        max-width: none !important;
        overflow: visible !important;
        text-overflow: clip !important;
        white-space: normal !important;
        overflow-wrap: normal !important;
        word-break: normal !important;
        font-size: 10.5px !important;
        line-height: 1.18 !important;
        text-align: right !important;
      }
    </style>
  </head>
  <body>
    <section id="cloudGate" class="cloud-gate">
      <div class="cloud-login-card">
        <img src="assets/logo-slt360.png" alt="SLT360" width="180" />
        <h1>Sala Técnica</h1>
        <p>Acesso individual · ambiente protegido</p>
        <form id="cloudLogin">
          <label>E-mail<input name="email" type="email" autocomplete="username" required /></label>
          <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
        </form>
        <section id="firstAccess" hidden aria-labelledby="firstAccessTitle">
          <h2 id="firstAccessTitle">Crie sua senha pessoal</h2>
          <p>Este é seu primeiro acesso. Troque a senha provisória para liberar o sistema.</p>
          <form id="firstAccessForm">
            <label>Nova senha<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required aria-describedby="passwordHint" /></label>
            <small id="passwordHint">Use pelo menos 12 caracteres, com letras maiúsculas, minúsculas e números. Não reutilize a senha provisória.</small>
            <label>Confirmar nova senha<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required /></label>
            <button type="submit">Salvar nova senha e entrar</button>
          </form>
        </section>
        <p id="cloudMessage" role="status"></p>
        <button id="cloudSignOut" type="button" hidden>Sair desta conta</button>
      </div>
    </section>

    <div id="legacyShell" hidden>
      <div id="cloudStatus" role="status" data-state="saved">Sincronizado</div>
      <header class="app-header">
        <div class="brand">
          <button class="brand-home" type="button" data-view="dashboard" aria-label="Voltar para Home do SLT 360">
            <img class="brand-logo brand-logo--slt" src="assets/logo-slt360.png" alt="SLT 360" />
          </button>
          <span class="brand-divider" aria-hidden="true"></span>
          <img class="brand-logo brand-logo--hapvida" src="assets/logo-hapvida.png" alt="Hapvida" />
        </div>

        <nav class="top-nav" aria-label="Navegação principal">
          <button class="top-nav__item top-nav__home is-active" type="button" data-view="dashboard">Home</button>
          <button class="top-nav__item" type="button" data-view="worksOperational" data-module="works">Obras</button>
          <button class="top-nav__item" type="button" data-view="maintenance" data-module="maintenance">Manutenção</button>
          <button class="top-nav__item" type="button" data-view="clinical" data-module="clinical">Eng. Clínica</button>
          <button class="top-nav__item" type="button" data-view="budget">Controle de Verbas</button>
          <button class="top-nav__item" type="button" data-view="settings">Configuração</button>
        </nav>

        <div class="header-actions">
          <div class="header-support" id="supportAssistantMount"></div>
          <span class="user-chip">Coordenação ST</span>
          <button class="secondary-action logout-action" type="button" data-action="logout" hidden>Sair</button>
        </div>
      </header>

      <main class="app-shell">
        <aside class="sidebar" aria-label="Menu lateral">
          <button class="side-link is-active" type="button" data-view="dashboard"><span>Início</span></button>
          <button class="side-link" type="button" data-view="worksOperational"><span>Visão Operacional</span></button>
          <button class="side-link" type="button" data-view="worksManagement"><span>Visão Gerencial</span></button>
          <button class="side-link" type="button" data-view="worksStrategic"><span>Visão Estratégica</span></button>
          <button class="side-link" type="button" data-view="portfolio"><span>Portfólio de Obras</span></button>
          <button class="side-link" type="button" data-view="sics"><span>Estudo de SIC's</span></button>
          <button class="side-link" type="button" data-view="investmentPlan"><span>Plano de Investimento</span></button>
          <button class="side-link" type="button" data-view="worksSettings"><span>Config. Obras</span></button>
          <button class="side-link" type="button" data-view="maintenance"><span>Manutenção</span></button>
          <button class="side-link" type="button" data-view="maintenanceOperational"><span>Operacional Manutenção</span></button>
          <button class="side-link" type="button" data-view="maintenanceReports"><span>BI Manutenção</span></button>
          <button class="side-link" type="button" data-view="clinical"><span>Engenharia Clínica</span></button>
          <button class="side-link" type="button" data-view="analytics"><span>Disciplina & Tipologia</span></button>
          <button class="side-link" type="button" data-view="budget"><span>Controle de Verbas</span></button>
          <button class="side-link" type="button" data-view="suppliers"><span>Fornecedores</span></button>
          <button class="side-link" type="button" data-view="settings"><span>Configurações</span></button>
        </aside>

        <section class="workspace" id="app" aria-live="polite"></section>
      </main>

      <div id="modalRoot"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="boot.js"></script>
  </body>
</html>
